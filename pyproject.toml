# Tooling config for the Orbit backend (Python/Flask on App Engine).
# The iOS app under OrbitApp/ is not covered here.

[tool.ruff]
target-version = "py311"
# The backend package, tests, and the entrypoint.
include = ["OrbitServer/**/*.py", "tests/**/*.py", "main.py"]
line-length = 120

[tool.ruff.lint]
# Start with the rules that catch real defects, not cosmetic churn:
#   F  = pyflakes (unused imports/vars, undefined names, f-string bugs)
#   E9 = syntax / IndentationError
#   B  = flake8-bugbear (likely-bug patterns)
# Style-only rules can be added later once the team opts in.
select = ["F", "E9", "B"]
# B008 (function call in default arg) is a deliberate Flask/route idiom here.
ignore = ["B008"]

[tool.pytest.ini_options]
# Enforce a coverage floor so the security/auth work can't silently regress.
# Baseline at introduction was ~45%; the floor is set below that with headroom
# and is meant to be ratcheted up over time, never down.
addopts = "--cov=OrbitServer --cov-report=term-missing --cov-fail-under=40"
testpaths = ["tests"]

[tool.coverage.run]
source = ["OrbitServer"]
omit = ["OrbitServer/*/__init__.py"]
